name: examen-mern
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 800m
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGO_URI: mongodb://mongo:27017/examdb
      JWT_SECRET: ${JWT_SECRET:?Lancer bash scripts/setup.sh}
      COOKIE_SECURE: 'false'
      PUBLIC_ORIGIN: http://localhost:3000
      GATEWAY_URL: http://gateway:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Lancer bash scripts/setup.sh}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 400m
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      GATEWAY_PORT: '8000'
      NOTIFI_SERVICE_URL: http://notifications:4002
      STOCK_SERVICE_URL: http://stock-management:4003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Lancer bash scripts/setup.sh}
    depends_on:
      - notifications
      - stock-management
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 200m
  notifications:
    build: ./microservices/notifications
    restart: unless-stopped
    environment:
      NOTIFI_PORT: '4002'
      MAIL_MODE: ${MAIL_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 200m
  stock-management:
    build: ./microservices/stock-management
    restart: unless-stopped
    environment:
      STOCK_PORT: '4003'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 200m
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      backend: { condition: service_healthy }
    mem_limit: 150m
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - '127.0.0.1:3009:3001'
    volumes:
      - uptime_data:/app/data
    mem_limit: 400m
volumes:
  mongo_data:
  uptime_data:
