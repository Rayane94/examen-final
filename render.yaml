# Déploiement de démonstration compatible avec l'offre gratuite Render.
# Les tests locaux continuent avec docker-compose.yml.
services:
  - type: web
    name: examen-final-mern-prod
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MAIL_MODE
        value: disabled
      - key: ADMIN_USERNAME
        value: admin-examen
      - key: ADMIN_EMAIL
        value: admin-examen@example.com
      - key: ADMIN_PASSWORD
        sync: false
