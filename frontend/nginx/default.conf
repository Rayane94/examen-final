server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    # Résolution DNS interne Docker renouvelée lorsque le backend est recréé.
    # Évite les 502 persistants après un `docker compose up --force-recreate backend`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_host backend:5000;
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
